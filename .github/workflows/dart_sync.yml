name: Daily DART Earnings Sync

on:
  schedule:
    # 평일 오후 4시(16:00 KST = 07:00 UTC) 및 오후 7시(19:00 KST = 10:00 UTC) 자동 실행
    - cron: '0 7,10 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-dart:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run DART + Naver Finance Earnings Sync
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: |
          python server.py --sync-once

      - name: Commit and Push updated earnings_data.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add earnings_data.json
          git diff --staged --quiet || git commit -m "Auto-update DART earnings data (16:00 / 19:00 KST)"
          git push
