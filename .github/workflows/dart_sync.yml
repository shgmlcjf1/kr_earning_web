name: Daily DART Earnings Sync (After-Market Auto Update)

on:
  schedule:
    - cron: '15 7,8,9,10,11 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-dart:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Seoul
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run DART + Public Disclosure News Sync
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: |
          python server.py --sync-once
      - name: Commit and Push updated earnings_data.json & index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add earnings_data.json index.html kr_earnings_screener.html
          git diff --staged --quiet || (git commit -m "Auto-update DART 3Q earnings data" && git push)
